server:
  port: 8085
spring:
  application:
    name: "ms-report"
  devtools:
    add-properties: false
  data:
    mongodb:
      uri: "mongodb://reto:123@localhost:27017/report_db?authSource=admin"
adapter:
  restconsumer:
    technology-url: "http://localhost:8081"
    capability-url: "http://localhost:8082"
    person-url: "http://localhost:8084"
    timeout: 5000
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: "/report/api/doc/swagger-ui.html"
  api-docs:
    path: "/report/api/doc/api-docs"

routes:
  paths:
    bootcamp-top-enrolled: /report/api/v1/bootcamp-reports/top-enrolled

resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
entrypoint:
  sqs:
    region: "us-east-1"
    bootcamp-report-queue-url: "https://sqs.us-east-1.amazonaws.com/225422344476/bootcampReportQueue"
    person-enrollment-queue-url: "https://sqs.us-east-1.amazonaws.com/225422344476/personEnrollmentQueue"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
